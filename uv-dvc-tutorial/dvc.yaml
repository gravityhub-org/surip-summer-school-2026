stages:
  fetch_skymaps:
    wdir: .
    cmd: uv run python load_script/generate_skymaps.py
    deps:
      - load_script/generate_skymaps.py
    outs:
      - data/skymaps

  fetch_pe:
    wdir: .
    cmd: uv run python load_script/load_pe.py
    deps:
      - load_script/load_pe.py
    outs:
      - data/PE

  ex01_halo_ps:
    wdir: .
    cmd: uv run python exercises/ex01_halo_ps.py
    deps:
      - exercises/ex01_halo_ps.py
      - pyproject.toml
    outs:
      - output/ex01_halo_mass_function.png
      - output/ex01_power_spectrum.png

  ex02_skymaps:
    wdir: .
    cmd: uv run python exercises/ex02_skymaps.py
    deps:
      - exercises/ex02_skymaps.py
      - data/skymaps
    outs:
      - output/ex02_GW150914.png
      - output/ex02_overlay.png

  ex03_euclid_mock:
    wdir: .
    cmd: uv run python exercises/ex03_euclid_mock.py
    deps:
      - exercises/ex03_euclid_mock.py
      - data/euclid/euclid_lens_spec.md
    outs:
      - output/euclid_lens_image.fits
      - output/euclid_lens_psf.fits
      - output/euclid_lens_noise_map.fits
      - output/euclid_lens_dataset.png
      - output/euclid_lens_image.png

  ex04_PE:
    wdir: .
    cmd: uv run python exercises/ex04_PE.py
    deps:
      - exercises/ex04_PE.py
      - data/PE
    outs:
      - output/ex04_corner_GW150914.png
      - output/ex04_corner_GW170817.png
      - output/ex04_corner_GW170814.png
